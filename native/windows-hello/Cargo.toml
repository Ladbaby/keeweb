[package]
name = "windows-hello"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["async", "napi8"] }
napi-derive = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Security_Credentials",
    "Security_Credentials_UI",
    "Security_Cryptography",
    "Storage_Streams",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Foundation",
]}
sha2 = "0.10"
rand = "0.8"
aes-gcm = "0.10"
lazy_static = "1.4"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
